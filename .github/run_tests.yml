name: Senior Care App - Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: pip install beautifulsoup4

    - name: 🧪 Run test suite
      run: python tests/test_senior_care_app.py index.html

    - name: ✅ Tests passed!
      if: success()
      run: echo "All tests passed - safe to deploy!"

    - name: ❌ Tests failed!
      if: failure()
      run: echo "Tests failed - check output above before merging!"
